<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Counting & Binomial Trees</title>
  <script src="https://d3js.org/d3.v7.min.js"></script>
  <style>
    :root { --bg:#f6f9fc;--card:#fff;--ink:#14213d;--muted:#64748b;--line:#dce6f1;--blue:#0798d2;--blue-soft:#e7f7fd;--success:#16a34a;--failure:#7c3aed;--shadow:0 10px 30px rgba(31,55,84,.08); }
    *{box-sizing:border-box} body{margin:0;color:var(--ink);background:radial-gradient(circle at 15% 0%,#e9f7fd 0,transparent 28%),var(--bg);font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif} button,input,select{font:inherit}
    .app{max-width:1500px;margin:auto;padding:18px} header{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;margin-bottom:14px} h1{margin:0;font-size:clamp(22px,3vw,34px);letter-spacing:-.03em} header p{margin:5px 0 0;color:var(--muted);font-size:13px}
    .lesson-tabs{display:flex;padding:4px;border:1px solid var(--line);border-radius:12px;background:#fff}.lesson-tabs button{border:0;border-radius:9px;background:transparent;padding:9px 14px;cursor:pointer;color:var(--muted)}.lesson-tabs button.active{background:var(--ink);color:#fff}
    .layout{display:grid;grid-template-columns:270px minmax(0,1fr) 300px;gap:12px}.panel{background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow)}.controls,.explanation{padding:15px}.visual{padding:10px;min-width:0;overflow:hidden}
    h2{margin:0 0 10px;color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.1em}.field{margin:12px 0}label{display:flex;justify-content:space-between;color:var(--muted);font-size:12px;margin-bottom:5px}select,input[type=number]{width:100%;border:1px solid var(--line);border-radius:9px;padding:8px 9px;color:var(--ink);background:#fff}input[type=range]{width:100%;accent-color:var(--blue)}
    .button-row{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:9px}.prob-row{display:flex;justify-content:space-between;align-items:center;padding:5px 7px;border-radius:9px;background:#f8fafc;font-size:12px;font-weight:750}.prob-row.p{color:var(--success)}.prob-row.q{color:var(--failure)}button.control{border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:9px;padding:8px;cursor:pointer}button.control:hover{border-color:#8dcde8;background:#f7fcff}button.primary{background:var(--blue-soft);border-color:#a9def2;color:#05698f;font-weight:700}.toggle-active{background:var(--ink)!important;color:#fff!important;border-color:var(--ink)!important}button:disabled{opacity:.4;cursor:not-allowed}
    .stage-dots{display:flex;gap:7px;margin:12px 0 5px}.stage-dot{height:6px;flex:1;border-radius:999px;background:#e2e8f0;transition:.3s}.stage-dot.active{background:var(--blue)}.stage-title{font-weight:750;font-size:14px;margin:9px 0 3px}.stage-copy{min-height:52px;color:var(--muted);font-size:12px;line-height:1.5}.tip{margin-top:12px;padding:9px 10px;border-radius:10px;background:#f8fafc;color:#475569;font-size:11px;line-height:1.45}

    #results{display:flex;flex-direction:column;gap:7px;max-height:525px;overflow:auto;padding-right:3px}.result{border:1px solid var(--line);border-radius:10px;padding:8px;cursor:pointer;transition:.2s}.result:hover,.result.active{border-color:#71c7e7;background:#f0faff}.result-head{display:flex;justify-content:space-between;align-items:baseline;font-size:12px;font-weight:700}.result-detail{margin-top:4px;color:var(--muted);font:10px ui-monospace,monospace;overflow-wrap:anywhere}.bar{height:5px;background:#e9eff5;border-radius:9px;overflow:hidden;margin-top:7px}.bar>i{display:block;height:100%;background:var(--blue);border-radius:9px;transition:width .45s}.status{margin-top:10px;font-size:11px;color:var(--muted);text-align:center}
    .edge{fill:none;stroke:#cfdbe7;stroke-width:1.35}.edge.s{stroke:var(--success)}.edge.f{stroke:var(--failure)}.edge.dim,.node.dim{opacity:.1}.edge.focus{stroke-width:3;filter:drop-shadow(0 0 2px rgba(7,152,210,.25))}.node circle{fill:#fff;stroke:#a9bacb;stroke-width:1.4}.node text{font-size:10px;fill:#334155;font-family:ui-monospace,monospace}.leaf text{font-weight:700}.edge-label{font-size:10px;font-style:italic}.guide{stroke:#e7eef6;stroke-dasharray:4 5}.guide-label{font-size:10px;font-weight:700;fill:#8797a9;letter-spacing:.08em}.bin-node circle{fill:#fff;stroke:#9ab1c5;stroke-width:1.5}.bin-node.active circle{fill:var(--blue-soft);stroke:var(--blue);stroke-width:2.5}.bin-node text.main{font-weight:750;font-size:11px}.bin-node text.prob{fill:#64748b;font-size:9px}.merge-line{fill:none;stroke:var(--blue);stroke-width:1.4;opacity:.55}.callout rect{fill:#fff;stroke:#8dd3ef}.callout text{font-size:11px;fill:#075985}
    @media(max-width:1050px){.layout{grid-template-columns:240px minmax(0,1fr)}.explanation{grid-column:1/-1}#results{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));max-height:none}}@media(max-width:720px){header{align-items:stretch;flex-direction:column}.layout{grid-template-columns:1fr}.explanation{grid-column:auto}#tree{height:600px}}@media(prefers-reduced-motion:reduce){*{transition-duration:.01ms!important;animation-duration:.01ms!important}}
  </style>
</head>
<body>
<div class="app">
  <header><div><h1>Counting & Binomial Trees</h1><p>From ordered outcomes to counts—and from counts to a probability distribution.</p></div><nav class="lesson-tabs" aria-label="Visualization lesson"><button id="countingTab">Counting tree</button><button id="binomialTab" class="active">Binomial process</button></nav></header>
  <div class="layout">
    <aside class="panel controls">
      <h2>Experiment</h2>
      <div id="countingControls" hidden><div class="field"><label for="symbols">Objects <span id="symbolValue">4</span></label><input id="symbols" type="range" min="2" max="6" value="4"></div><div class="field"><label for="draws">Draws <span id="drawValue">2</span></label><input id="draws" type="range" min="1" max="5" value="2"></div><div class="field"><label for="repeat">Replacement</label><select id="repeat"><option value="no">Without replacement</option><option value="yes">With replacement</option></select></div></div>
      <div id="binomialControls"><div class="field"><label for="trials">Trials n <span id="trialValue">3</span></label><input id="trials" type="range" min="1" max="6" value="3"></div><div class="field"><label for="prob">Success probability p <span id="probValue">0.50</span></label><input id="prob" type="range" min="0" max="1" step="0.05" value="0.5"><div class="prob-row p"><span>success probability p</span><span id="pMirror">0.50</span></div><div class="prob-row q"><span>failure probability q = 1 − p</span><span id="qMirror">0.50</span></div></div><div class="formula-card"><div class="formula"><i>X</i> = # of S</div><div class="legend"><span><i class="dot" style="background:var(--success)"></i>S, p</span><span><i class="dot" style="background:var(--failure)"></i>F, q = 1 − p</span></div></div><div class="button-row"><button class="control toggle-active" id="formulaMode">Show formula</button><button class="control" id="numberMode">Show numbers</button></div></div>
      <h2>Animation</h2><div class="stage-dots"><i class="stage-dot"></i><i class="stage-dot"></i><i class="stage-dot"></i><i class="stage-dot"></i></div><div class="stage-title" id="stageTitle"></div><div class="stage-copy" id="stageCopy"></div>
      <div class="button-row"><button class="control" id="prev">← Previous</button><button class="control primary" id="next">Next →</button></div><div class="button-row"><button class="control primary" id="play">▶ Play lesson</button><button class="control" id="reset">Reset</button></div><div class="field"><label for="speed">Animation speed</label><select id="speed"><option value="1500">Slow</option><option value="950" selected>Normal</option><option value="550">Fast</option></select></div><div class="tip" id="tip"></div>
    </aside>
    <main class="panel visual"><svg id="tree" role="img" aria-label="Interactive counting and binomial tree"></svg></main>
    <aside class="panel explanation"><h2 id="resultHeading">Distribution of X</h2><div class="formula-card" id="mainFormula"></div><div id="results"></div><div class="status" id="status" aria-live="polite"></div></aside>
  </div>
</div>
<script>
const C={success:'#16a34a',failure:'#7c3aed',blue:'#0798d2'},alphabet='ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split(''),$=id=>document.getElementById(id);
const els={svg:d3.select('#tree'),countingTab:$('countingTab'),binomialTab:$('binomialTab'),countingControls:$('countingControls'),binomialControls:$('binomialControls'),symbols:$('symbols'),draws:$('draws'),repeat:$('repeat'),trials:$('trials'),prob:$('prob'),symbolValue:$('symbolValue'),drawValue:$('drawValue'),trialValue:$('trialValue'),probValue:$('probValue'),pMirror:$('pMirror'),qMirror:$('qMirror'),formulaMode:$('formulaMode'),numberMode:$('numberMode'),prev:$('prev'),next:$('next'),play:$('play'),reset:$('reset'),speed:$('speed'),stageTitle:$('stageTitle'),stageCopy:$('stageCopy'),dots:[...document.querySelectorAll('.stage-dot')],results:$('results'),heading:$('resultHeading'),formula:$('mainFormula'),status:$('status'),tip:$('tip')};
const state={lesson:'binomial',stage:0,n:3,p:.5,probView:'formula',countN:4,draws:2,repeat:'no',selected:null,timer:null};
const stageText={binomial:[['1. Build the sample space','The tree animates from Start to Trial n. Each branch adds one ordered S/F outcome.'],['2. Count successes','Order is visible in the sample space, but the count X only cares how many S outcomes occurred. SF and FS have the same count.'],['3. Merge equal counts','Multiply along each ordered path, then add paths with the same count: SF + FS gives pq + qp = 2pq.'],['4. Reveal the distribution','The recombining tree keeps only the current success count. Counting paths gives the binomial coefficient.']],counting:[['1. Enumerate','Build every ordered draw one branch at a time.'],['2. Ignore order','Highlight outcomes that differ only in order.'],['3. Merge','Collapse each equivalence class into one combination.'],['4. Compare counts','See how many ordered outcomes produce each unordered result.']]};
function choose(n,k){if(k<0||k>n)return 0;let v=1;for(let i=1;i<=Math.min(k,n-k);i++)v=v*(n-i+1)/i;return Math.round(v)}function canonical(s){return s.split('').sort().join('')}function pathFormula(s){const ps=(s.match(/S/g)||[]).length,qs=s.length-ps,p=ps===0?'':ps===1?'p':`p^${ps}`,q=qs===0?'':qs===1?'q':`q^${qs}`;return p+q||'1'}function mergedFormula(k,n=state.n){const c=choose(n,k),term=pathFormula('S'.repeat(k)+'F'.repeat(n-k));return c===1?term:`${c}${term}`}function binProb(k,t=state.n){return choose(t,k)*state.p**k*(1-state.p)**(t-k)}function pathProb(s){return [...s].reduce((v,ch)=>v*(ch==='S'?state.p:1-state.p),1)}function fmt(x){return x<.0005?'<.001':x.toFixed(3)}
function allBinary(n){const a=[];function walk(s){if(s.length===n){a.push(s);return}walk(s+'S');walk(s+'F')}walk('');return a}
function countSequences(){const syms=alphabet.slice(0,state.countN),out=[];function walk(s,used){if(s.length===state.draws){out.push(s);return}syms.forEach((x,i)=>{if(state.repeat==='no'&&used.has(i))return;const u=new Set(used);if(state.repeat==='no')u.add(i);walk(s+x,u)})}walk('',new Set());return out}
function groups(){const seqs=state.lesson==='binomial'?allBinary(state.n):countSequences(),map=new Map();seqs.forEach(s=>{const key=state.lesson==='binomial'?String((s.match(/S/g)||[]).length):canonical(s);if(!map.has(key))map.set(key,[]);map.get(key).push(s)});return new Map([...map].sort((a,b)=>state.lesson==='binomial'?+a[0]-+b[0]:a[0].localeCompare(b[0])))}
function stop(){if(state.timer)clearTimeout(state.timer);state.timer=null;els.play.textContent='▶ Play lesson'}function setStage(s){stop();state.stage=Math.max(0,Math.min(3,s));if(state.stage===0)state.selected=null;render()}
function syncControls(){state.n=+els.trials.value;state.p=+els.prob.value;state.countN=+els.symbols.value;state.draws=+els.draws.value;state.repeat=els.repeat.value;if(state.repeat==='no'&&state.draws>state.countN){state.draws=state.countN;els.draws.value=state.draws}els.symbolValue.textContent=state.countN;els.drawValue.textContent=state.draws;els.trialValue.textContent=state.n;els.probValue.textContent=state.p.toFixed(2);els.pMirror.textContent=state.p.toFixed(2);els.qMirror.textContent=(1-state.p).toFixed(2);els.formulaMode.classList.toggle('toggle-active',state.probView==='formula');els.numberMode.classList.toggle('toggle-active',state.probView==='numbers')}
function renderMeta(){const t=stageText[state.lesson][state.stage];els.stageTitle.textContent=t[0];els.stageCopy.textContent=t[1];els.dots.forEach((d,i)=>d.classList.toggle('active',i<=state.stage));els.prev.disabled=state.stage===0;els.next.disabled=state.stage===3;const bin=state.lesson==='binomial';els.binomialTab.classList.toggle('active',bin);els.countingTab.classList.toggle('active',!bin);els.binomialControls.hidden=!bin;els.countingControls.hidden=bin;els.heading.textContent=bin?'Distribution of X':'Outcome groups';els.tip.textContent=bin?'p and q are symmetric: changing p automatically changes q = 1 − p. Click X = k to trace all paths with the same count.':'Click a group to trace all permutations that merge into that combination.';els.formula.innerHTML=bin?`<div class="formula">P(X = k) = <b>C(n,k)</b><span class="p">p<sup>k</sup></span><span class="q">q<sup>n−k</sup></span></div><div class="legend">n=${state.n}, <span style="color:var(--success);font-weight:700">p=${state.p.toFixed(2)}</span>, <span style="color:var(--failure);font-weight:700">q=${(1-state.p).toFixed(2)}</span></div>`:`<div class="formula">ordered outcomes → unordered groups</div><div class="legend">n=${state.countN} objects, r=${state.draws} draws</div>`}
function renderResults(){const map=groups();els.results.innerHTML='';map.forEach((seqs,key)=>{const div=document.createElement('div');div.className='result'+(state.selected===key?' active':'');div.tabIndex=0;div.setAttribute('role','button');if(state.lesson==='binomial'){const k=+key,pr=binProb(k),pathPr=seqs.length?pathProb(seqs[0]):0,detail=state.probView==='formula'?`C(${state.n},${key}) = ${seqs.length}; each path ${pathFormula(seqs[0]||'')} · merged: ${mergedFormula(k)}`:`${seqs.length} same-probability path${seqs.length===1?'':'s'} × ${fmt(pathPr)} = ${fmt(pr)} · ${seqs.join(', ')}`;div.setAttribute('aria-label',`Trace paths for X equals ${key}`);div.innerHTML=`<div class="result-head"><span>X = ${key}</span><span>${state.probView==='formula'?mergedFormula(k):fmt(pr)}</span></div><div class="result-detail">${detail}</div><div class="bar"><i style="width:${pr*100}%"></i></div>`}else{div.setAttribute('aria-label',`Trace permutations of ${key}`);div.innerHTML=`<div class="result-head"><span>${key}</span><span>× ${seqs.length}</span></div><div class="result-detail">${seqs.join(', ')}</div>`}const select=()=>{stop();if(state.lesson==='binomial'&&state.stage===3)state.stage=2;state.selected=state.selected===key?null:key;render()};div.onclick=select;div.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();select()}};els.results.appendChild(div)});const total=state.lesson==='binomial'?2**state.n:countSequences().length;els.status.textContent=state.lesson==='binomial'?`${total} ordered paths → ${state.n+1} possible values of X; order disappears after counting successes.`:`${total} ordered outcomes → ${map.size} unordered groups`}
function dimensions(){const node=els.svg.node(),w=Math.max(560,node.clientWidth||800),h=Math.max(600,node.clientHeight||680);els.svg.attr('viewBox',`0 0 ${w} ${h}`);return{w,h}}function edgePath(a,b){return`M${a.y},${a.x} C${(a.y+b.y)/2},${a.x} ${(a.y+b.y)/2},${b.x} ${b.y},${b.x}`}
function binaryHierarchy(){const root={seq:'',depth:0,children:[]};function walk(o){if(o.depth===state.n)return;['S','F'].forEach(v=>{const c={seq:o.seq+v,name:v,depth:o.depth+1,children:[]};o.children.push(c);walk(c)})}walk(root);return d3.hierarchy(root)}

function drawGuides(svg,depth,xFor,h){const g=svg.append('g');for(let t=0;t<=depth;t++){const y=xFor(t);g.append('line').attr('class','guide').attr('x1',y).attr('x2',y).attr('y1',36).attr('y2',h-25);g.append('text').attr('class','guide-label').attr('x',y).attr('y',22).attr('text-anchor','middle').text(t===0?'START':`TRIAL ${t}`)}}
function drawFullTree(){const{w,h}=dimensions(),svg=els.svg;svg.selectAll('*').remove();const isBin=state.lesson==='binomial',root=isBin?binaryHierarchy():countingHierarchy(),depth=isBin?state.n:state.draws,left=34,right=state.stage>=2?175:90,xFor=t=>left+t*(w-left-right)/Math.max(1,depth);d3.tree().size([h-80,w-left-right])(root);root.descendants().forEach(d=>{d.x=48+d.x*.9;d.y=xFor(d.depth)});drawGuides(svg,depth,xFor,h);const selectedNodes=new Set(),selectedEdges=new Set();if(state.selected!==null){root.leaves().filter(l=>(isBin?String((l.data.seq.match(/S/g)||[]).length):canonical(l.data.seq))===state.selected).forEach(l=>{l.ancestors().forEach(n=>selectedNodes.add(n));l.ancestors().slice(0,-1).forEach(n=>selectedEdges.add(`${n.parent?.data.seq}|${n.data.seq}`))})}
const links=svg.append('g').selectAll('path').data(root.links()).join('path').attr('class',d=>{const type=d.target.data.name?.toLowerCase()==='s'?'s':d.target.data.name?.toLowerCase()==='f'?'f':'',key=`${d.source.data.seq}|${d.target.data.seq}`;return`edge ${isBin?type:''} ${state.selected!==null&&!selectedEdges.has(key)?'dim':''} ${selectedEdges.has(key)?'focus':''}`}).attr('d',d=>edgePath(d.source,d.target)).attr('stroke-dasharray',function(){const l=this.getTotalLength();return`${l} ${l}`}).attr('stroke-dashoffset',function(){return this.getTotalLength()});links.transition().delay(d=>d.target.depth*110).duration(430).attr('stroke-dashoffset',0);
if(isBin)svg.append('g').selectAll('text').data(root.links().filter(d=>state.n<=4||d.target.depth>=depth-1)).join('text').attr('class','edge-label').attr('x',d=>(d.source.y+d.target.y)/2).attr('y',d=>(d.source.x+d.target.x)/2-4).attr('fill',d=>d.target.data.name==='S'?C.success:C.failure).text(d=>d.target.data.name==='S'?'S, p':'F, q');const node=svg.append('g').selectAll('g').data(root.descendants()).join('g').attr('class',d=>`node ${d.depth===depth?'leaf':''} ${state.selected!==null&&!selectedNodes.has(d)?'dim':''}`).attr('transform',d=>`translate(${d.y},${d.x})`);node.append('circle').attr('r',d=>d.depth===0?7:5.5).attr('fill',d=>isBin&&d.depth?d.data.name==='S'?C.success:C.failure:'#fff');node.append('text').attr('x',d=>d.depth===depth?10:9).attr('y',3).text(d=>{if(d.depth===0)return'Start';if(isBin&&state.n>4&&d.depth<depth-1)return'';return d.data.seq}).attr('fill',d=>{if(!isBin||d.depth<depth)return'#334155';const k=(d.data.seq.match(/S/g)||[]).length;return d3.schemeTableau10[k%10]});if(state.stage>=1&&isBin)node.filter(d=>d.depth===depth).append('text').attr('x',10).attr('y',15).attr('font-size',8).attr('fill','#64748b').text(d=>`X=${(d.data.seq.match(/S/g)||[]).length}`);if(state.stage>=1&&isBin)node.filter(d=>d.depth===depth||(state.n<=4&&d.depth>0)).append('text').attr('x',10).attr('y',27).attr('font-size',8).attr('fill','#475569').text(d=>pathFormula(d.data.seq));if(state.stage>=2)drawMerge(svg,root,w,h,isBin)}
function drawMerge(svg,root,w,h,isBin){const map=new Map();root.leaves().forEach(l=>{const k=isBin?String((l.data.seq.match(/S/g)||[]).length):canonical(l.data.seq);if(!map.has(k))map.set(k,[]);map.get(k).push(l)});const keys=[...map.keys()].sort((a,b)=>isBin?+a-+b:a.localeCompare(b)),active=state.selected===null?new Set(keys):new Set([state.selected]),top=55,bottom=h-42,step=(bottom-top)/Math.max(1,keys.length-1),targetY=w-82;keys.forEach((k,i)=>{if(!active.has(k))return;const tx=keys.length===1?(top+bottom)/2:top+i*step;map.get(k).forEach(l=>svg.append('path').attr('class','merge-line').attr('d',edgePath(l,{x:tx,y:targetY})).attr('stroke-dasharray',function(){const z=this.getTotalLength();return`${z} ${z}`}).attr('stroke-dashoffset',function(){return this.getTotalLength()}).transition().duration(600).attr('stroke-dashoffset',0));const g=svg.append('g').attr('class','callout').attr('transform',`translate(${targetY},${tx})`).style('opacity',0);g.append('rect').attr('x',-31).attr('y',-15).attr('width',62).attr('height',30).attr('rx',15);g.append('text').attr('text-anchor','middle').attr('y',4).text(isBin?`X=${k} ×${map.get(k).length}`:`${k} ×${map.get(k).length}`);g.transition().delay(350).duration(300).style('opacity',1)})}
function drawBinomialTree(){const{w,h}=dimensions(),svg=els.svg;svg.selectAll('*').remove();const margin={l:58,r:58,t:56,b:50},x=t=>margin.l+t*(w-margin.l-margin.r)/Math.max(1,state.n),y=(t,k)=>margin.t+(k+.5)*(h-margin.t-margin.b)/(t+1);drawGuides(svg,state.n,x,h);const edges=[];for(let t=0;t<state.n;t++)for(let k=0;k<=t;k++){edges.push({a:{y:x(t),x:y(t,k)},b:{y:x(t+1),x:y(t+1,k+1)},type:'S',t});edges.push({a:{y:x(t),x:y(t,k)},b:{y:x(t+1),x:y(t+1,k)},type:'F',t})}const edge=svg.append('g').selectAll('path').data(edges).join('path').attr('class',d=>`edge ${d.type.toLowerCase()}`).attr('d',d=>edgePath(d.a,d.b)).attr('stroke-dasharray',function(){const l=this.getTotalLength();return`${l} ${l}`}).attr('stroke-dashoffset',function(){return this.getTotalLength()});edge.transition().delay(d=>d.t*260).duration(500).attr('stroke-dashoffset',0);svg.append('g').selectAll('text').data(edges.filter(d=>state.n<=4||d.t>=state.n-2)).join('text').attr('class','edge-label').attr('x',d=>(d.a.y+d.b.y)/2).attr('y',d=>(d.a.x+d.b.x)/2+(d.type==='S'?-6:12)).attr('text-anchor','middle').attr('fill',d=>d.type==='S'?C.success:C.failure).text(d=>d.type==='S'?'p':'q');const nodes=[];for(let t=0;t<=state.n;t++)for(let k=0;k<=t;k++)nodes.push({t,k,x:y(t,k),y:x(t),pr:binProb(k,t)});const ng=svg.append('g').selectAll('g').data(nodes).join('g').attr('class',d=>`bin-node ${d.t===state.n&&(state.selected===null||state.selected===String(d.k))?'active':''}`).attr('transform',d=>`translate(${d.y},${d.x})`).style('opacity',0);ng.append('circle').attr('r',d=>d.t===state.n?22:18);ng.append('text').attr('class','main').attr('text-anchor','middle').attr('y',-2).text(d=>state.n>4&&d.t>0&&d.t<state.n-1?'':d.k);ng.append('text').attr('class','prob').attr('text-anchor','middle').attr('y',11).text(d=>state.n>4&&d.t<state.n-1?'':fmt(d.pr));ng.transition().delay(d=>d.t*260+180).duration(350).style('opacity',1);svg.append('text').attr('x',margin.l).attr('y',h-18).attr('fill','#64748b').attr('font-size',11).text('Path probabilities multiply left to right; blue merge lines add same-count paths, so counting × one path probability gives the binomial result.')}
function render(){syncControls();renderMeta();renderResults();if(state.lesson==='binomial'&&state.stage===3)drawBinomialTree();else drawFullTree()}
function play(){stop();state.stage=0;state.selected=null;els.play.textContent='❚❚ Pause';render();const wait=+els.speed.value;const advance=()=>{if(state.stage<3){state.stage++;if(state.stage===1&&state.lesson==='binomial')state.selected='1';else if(state.stage===2)state.selected=null;render();state.timer=setTimeout(advance,wait)}else stop()};state.timer=setTimeout(advance,wait)}
els.countingTab.onclick=()=>{stop();state.lesson='counting';state.stage=0;state.selected=null;render()};els.binomialTab.onclick=()=>{stop();state.lesson='binomial';state.stage=0;state.selected=null;render()};els.formulaMode.onclick=()=>{state.probView='formula';render()};els.numberMode.onclick=()=>{state.probView='numbers';render()};[els.symbols,els.draws,els.trials,els.prob].forEach(e=>e.oninput=()=>{stop();state.selected=null;render()});els.repeat.onchange=()=>{stop();state.selected=null;render()};els.prev.onclick=()=>setStage(state.stage-1);els.next.onclick=()=>setStage(state.stage+1);els.reset.onclick=()=>{stop();state.stage=0;state.selected=null;state.probView='formula';els.trials.value=3;els.prob.value=.5;els.symbols.value=4;els.draws.value=2;els.repeat.value='no';render()};els.play.onclick=()=>state.timer?stop():play();window.addEventListener('resize',()=>{stop();render()});render();
